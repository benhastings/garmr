name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        # The version clickhouse-observability-stack runs.
        image: clickhouse/clickhouse-server:26.9.5.2
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client -q 'SELECT 1'" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test, with the ClickHouse integration tests
        run: go test -race -count=1 ./...
        env:
          GARMR_TEST_CLICKHOUSE_ADDR: localhost:9000

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every run builds the image; a v* tag also pushes it as ghcr.io/benhastings/garmr:<tag>. Other runs
      # tag it ci, since a pull request's ref name (5/merge) isn't a valid image tag.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/benhastings/garmr:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
