name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version clickhouse-observability-stack runs, with an embedded Keeper for garmr's KeeperMap table.
      # A step rather than a service container, since the config file comes from the checkout.
      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 9000:9000 -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -v "$PWD/testdata/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro" \
            clickhouse/clickhouse-server:26.9.5.2
          for _ in $(seq 60); do
            docker exec clickhouse clickhouse-client -q 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs clickhouse
          exit 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test, with the ClickHouse integration tests
        run: go test -race -count=1 ./...
        env:
          GARMR_TEST_CLICKHOUSE_ADDR: localhost:9000

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every run builds the image; a v* tag also pushes it as ghcr.io/benhastings/garmr:<tag>. Other runs
      # tag it ci, since a pull request's ref name (5/merge) isn't a valid image tag.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/benhastings/garmr:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
